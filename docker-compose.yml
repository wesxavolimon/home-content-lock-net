version: '3.8'

services:
  build:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: home-content-lock-build
    volumes:
      - .:/src
      - /src/src/*/bin
      - /src/src/*/obj
      - /src/tests/*/bin
      - /src/tests/*/obj
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    command: dotnet build -c Release

  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: home-content-lock-test
    volumes:
      - .:/src
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    command: dotnet test -c Release --logger "console;verbosity=minimal"
